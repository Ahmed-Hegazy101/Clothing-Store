<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5dfc2"/>
      <stop offset="50%" stop-color="#c85a32"/>
      <stop offset="100%" stop-color="#a0421e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="14" fill="#141413"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="rgba(251,249,245,0.08)" stroke-width="1.5"/>

  <!-- Minimalist Luxury Clothing Hanger Icon -->
  <g filter="url(#shadow)">
    <!-- Hanger Hook -->
    <path d="M32 15 C35.5 15, 38 17.5, 38 20.5 C38 23.5, 35.5 25.5, 32 27 L32 30" 
          fill="none" stroke="url(#goldGrad)" stroke-width="2.6" stroke-linecap="round"/>
    
    <!-- Hanger Triangular Frame -->
    <path d="M32 30 L13 41 C11.8 41.7, 12.2 43.5, 13.8 43.5 L50.2 43.5 C51.8 43.5, 52.2 41.7, 51 41 Z" 
          fill="none" stroke="#fbf9f5" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Horizontal Crossbar Accent -->
    <line x1="15" y1="43.5" x2="49" y2="43.5" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>

    <!-- Center Atelier Diamond Accent -->
    <polygon points="32,34 34,36.5 32,39 30,36.5" fill="url(#goldGrad)"/>
  </g>
</svg>
